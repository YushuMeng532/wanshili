<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title"><title id="title">万事历事项创建到修改删除流程</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#54758a"/></marker></defs><rect width="640" height="720" rx="24" fill="#f8fafb"/><rect x="130" y="50" width="200" height="48" rx="16" fill="#fff" stroke="#8fb2c9"/><text x="230" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263842">选择日期</text><rect x="130" y="135" width="200" height="48" rx="16" fill="#fff" stroke="#8fb2c9"/><text x="230" y="165" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263842">新建事项</text><rect x="130" y="220" width="200" height="48" rx="16" fill="#fff" stroke="#8fb2c9"/><text x="230" y="250" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263842">类型、日期与循环</text><rect x="130" y="305" width="200" height="48" rx="16" fill="#fff" stroke="#8fb2c9"/><text x="230" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263842">保存</text><rect x="130" y="390" width="200" height="48" rx="16" fill="#fff" stroke="#8fb2c9"/><text x="230" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263842">当天列表</text><rect x="130" y="475" width="200" height="48" rx="16" fill="#fff" stroke="#8fb2c9"/><text x="230" y="505" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263842">事项详情</text><rect x="30" y="565" width="200" height="48" rx="16" fill="#fff" stroke="#8fb2c9"/><text x="130" y="595" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263842">编辑并确认范围</text><rect x="255" y="565" width="200" height="48" rx="16" fill="#fff" stroke="#8fb2c9"/><text x="355" y="595" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263842">删除并确认范围</text><path d="M230 98V133" stroke="#54758a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M230 183V218" stroke="#54758a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M230 268V303" stroke="#54758a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M230 353V388" stroke="#54758a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M230 438V473" stroke="#54758a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M230 523V545H130V563M230 545H355V563" stroke="#54758a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="380" y="292" width="230" height="104" rx="16" fill="#f8edf1"/><text x="398" y="325" font-family="sans-serif" font-size="15" fill="#8f6a76">异常分支</text><text x="398" y="353" font-family="sans-serif" font-size="14" fill="#263842">名称未填 / 保存失败</text><text x="398" y="377" font-family="sans-serif" font-size="14" fill="#263842">保留表单，修正或重试</text><path d="M330 329H377" stroke="#8f6a76" fill="none" marker-end="url(#arrow)"/><text x="30" y="664" font-family="sans-serif" font-size="14" fill="#627784">未保存退出 → 确认放弃或继续编辑</text><text x="30" y="694" font-family="sans-serif" font-size="14" fill="#627784">保存或删除成功后返回当天，保留其他事项</text></svg>
