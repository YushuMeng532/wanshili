name = "wanshili-ai"
main = "worker.mjs"
compatibility_date = "2026-11-24"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGIN = "https://yushumeng532.github.io"
DAILY_LIMIT = "100"

[[ratelimits]]
name = "AI_IP_LIMIT"
namespace_id = "61001"
simple = { limit = 5, period = 60 }

[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AIQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AIQuota"]
